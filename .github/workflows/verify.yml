name: Verify strategy lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Check traffic control infrastructure
        run: python3 -m unittest discover -s test -p "traffic*_test.py" && python3 test/infra_origin_test.py
      - name: Recompute the released research summary
        run: |
          npm run phase2:verify
          git diff --exit-code -- reports/phase2
      - name: Verify recorded and replayed decisions
        run: |
          npm run replay -- --agents threshold-5+open-pair,tree+open-random,board,mlp
          npm run replay -- --verify work/replay.json
          npm run replay -- --agents family-value-upgrade,match-mlp-11,matched-round-mlp-11,expanded-table
          npm run replay -- --verify work/replay.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise the downloaded HTML offline
        run: |
          python -m pip install playwright==1.62.0
          CHROMIUM_PATH="$(command -v google-chrome)" python test/coach_smoke.py
          python scripts/package.py --verify
      - name: Play and resume a hosted match
        run: |
          npm run online:package
          node scripts/dev-online.mjs > "$RUNNER_TEMP/skyjo-online.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ -o /dev/null; then break; fi
            sleep 1
          done
          CHROMIUM_PATH="$(command -v google-chrome)" python test/online_smoke.py
          CHROMIUM_PATH="$(command -v google-chrome)" python test/online_features_smoke.py
          CHROMIUM_PATH="$(command -v google-chrome)" python test/online_guardrails_smoke.py
